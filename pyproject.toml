[project]
name = "vast-s3-templates"
version = "0.1.0"
description = "boto3 templates hardened for VAST Data S3"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.103",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.6", "pyarrow>=25.0.1"]
s3fs = ["s3fs"]
test = ["moto[server]>=5.2.3", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vast_s3"]
